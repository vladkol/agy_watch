[project]
name = "agy_watch"
version = "0.1.0"
description = "Real-time Observability Console and Wire-Tap SDK for Google Antigravity Agents"
requires-python = ">=3.11, <3.14"
dependencies = [
    "google-antigravity==0.1.19",
    "python-dotenv==1.2.*",
    "httpx==0.28.*",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fastapi>=0.141.1",
    "firebase-admin>=7.5.0",
    "google-cloud-firestore>=2.28.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "textual>=0.70.0",
    "pyyaml>=6.0.0",
]

[tool.uv]
managed = true
package = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[project.scripts]
agy_watch = "agy_watch.cli:main"
agy-watch = "agy_watch.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["agy_watch*", "examples*"]
